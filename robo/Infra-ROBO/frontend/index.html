<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industria RA Cloud</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    #painel {
      position: fixed; top: 8px; left: 8px; z-index: 10;
      background: rgba(20, 24, 28, .85); color: #fff;
      padding: 10px 12px; border-radius: 8px; font-size: 13px; min-width: 220px;
    }
    #painel h1 { font-size: 14px; margin: 0 0 6px; }
    .linha { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
    .ok { color: #4cd137; } .alerta { color: #fbc531; } .critico { color: #ff5252; }
  </style>
</head>
<body>
  <div id="painel">
    <h1>Maquinas</h1>
    <div id="lista">Aguardando dados...</div>
  </div>

  <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker id="marker" preset="hiro"></a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const CORES = { ok: "#2e9e5b", alerta: "#e0a100", critico: "#d63b3b" };
    const marker = document.getElementById("marker");
    const lista = document.getElementById("lista");
    const nos = {};

    function criarNo(id) {
      const grupo = document.createElement("a-entity");
      const caixa = document.createElement("a-box");
      caixa.setAttribute("width", 0.8);
      caixa.setAttribute("height", 0.6);
      caixa.setAttribute("depth", 0.8);
      caixa.setAttribute("position", "0 0.3 0");
      const texto = document.createElement("a-text");
      texto.setAttribute("align", "center");
      texto.setAttribute("width", 3);
      texto.setAttribute("color", "#ffffff");
      texto.setAttribute("position", "0 1 0");
      grupo.appendChild(caixa);
      grupo.appendChild(texto);
      marker.appendChild(grupo);
      nos[id] = { grupo, caixa, texto };
    }

    function posicionar() {
      const ids = Object.keys(nos).sort();
      ids.forEach((id, i) => {
        const x = (i - (ids.length - 1) / 2) * 1.2;
        nos[id].grupo.setAttribute("position", `${x} 0 0`);
      });
    }

    async function atualizar() {
      try {
        const resposta = await fetch("/api/machines");
        const maquinas = await resposta.json();
        let novo = false;

        lista.innerHTML = "";
        maquinas.forEach((m) => {
          if (!nos[m.id]) { criarNo(m.id); novo = true; }
          nos[m.id].caixa.setAttribute("color", CORES[m.status]);
          nos[m.id].texto.setAttribute(
            "value",
            `${m.nome}\n${m.temperatura} C | ${m.rpm} rpm`
          );

          const linha = document.createElement("div");
          linha.className = "linha";
          linha.innerHTML = `<span>${m.nome}</span><span class="${m.status}">${m.temperatura} C</span>`;
          lista.appendChild(linha);
        });

        if (novo) posicionar();
        if (!maquinas.length) lista.textContent = "Aguardando dados...";
      } catch (erro) {
        lista.textContent = "Sem conexao com o backend.";
      }
    }

    atualizar();
    setInterval(atualizar, 2000);
  </script>
</body>
</html>
