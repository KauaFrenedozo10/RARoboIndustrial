services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ira-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ira-backend
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      FRONTEND_DIR: /app/frontend
    ports:
      - "5000:5000"
    volumes:
      - ./frontend:/app/frontend:ro
    depends_on:
      - mosquitto
    restart: unless-stopped

  simulator:
    build: ./simulator
    container_name: ira-simulator
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      INTERVALO: "2"
    depends_on:
      - mosquitto
    restart: unless-stopped
