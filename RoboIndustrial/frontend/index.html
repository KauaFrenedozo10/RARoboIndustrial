<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Manutenção Industrial com RA</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <a-scene projetor-hotspots
           mindar-image="imageTargetSrc: assets/targets/targets.mind; uiLoading: no; uiScanning: no; uiError: no;"
           color-space="sRGB"
           renderer="colorManagement: true, physicallyCorrectLights: true"
           vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="alvo" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <div id="camada-hotspots" class="camada-hotspots"></div>
  <header id="estado" class="estado">Carregando câmera…</header>

  <section id="painel" class="painel" hidden>
    <header class="painel-topo">
      <h2 id="painel-titulo"></h2>
      <button id="painel-fechar" class="botao-fechar" type="button" aria-label="Fechar">✕</button>
    </header>
    <div id="painel-corpo"></div>
    <footer class="painel-rodape">Dados simulados para fins didáticos.</footer>
  </section>
</body>
</html>
